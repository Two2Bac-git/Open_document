services:
  plow-agent:
    build: .
    image: plow-agent:local
    restart: unless-stopped
    environment:
      LANG: ${LANG:-en_US.UTF-8}   # folder names follow the host language
    security_opt:
      - label=disable   # SELinux (Fedora/RHEL): read the mounted folder without relabeling your files
    healthcheck:
      test: ["CMD-SHELL", "kill -0 \"$(cat /tmp/indexer.pid)\""]
      interval: 60s
      timeout: 5s
    volumes:
      - plow-state:/home/plow/.plow
      - ${PLOW_FOLDER:-./Downloads}:/home/plow/Downloads

volumes:
  plow-state:
