# Local run, the same way Plow's OpenClaw base does it:
#   plow-agents lines                 # pick a free line
#   plow-agents mint <LINE_UID>       # writes ./plow-credentials (never commit it)
#   docker compose up --build         # then text the line's number
services:
  agent:
    build: .
    env_file: ./plow-credentials
    volumes:
      - state:/var/lib/plow
    stop_grace_period: 35s
volumes:
  state:
